[project]
name = "dota-picker"
dynamic = ["version"]
description = "Counter-pick suggestions for your Dota 2 drafts, built on Dotabuff stats"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["dota2", "dotabuff", "draft", "counter-pick"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "curl_cffi>=0.7",
]

[project.scripts]
dota-picker = "dota_picker.__main__:main"

[dependency-groups]
dev = [
    "pre-commit>=4",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "dota_picker/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["dota_picker"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
